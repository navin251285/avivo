<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="520" viewBox="0 0 1560 520" role="img" aria-labelledby="title desc">
  <title id="title">Avivo RAG System Current Working Flow</title>
  <desc id="desc">Strict sequential chain: user to telegram-bot to rag-api to vector-db back to rag-api to llm-service back to rag-api to telegram-bot to user.</desc>

  <defs>
    <style>
      .title { font: 700 25px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .step { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .node { stroke-width: 2; rx: 14; }
      .user { fill: #fff7ed; stroke: #ea580c; }
      .bot { fill: #f0fdf4; stroke: #16a34a; }
      .api { fill: #eff6ff; stroke: #2563eb; }
      .vector { fill: #ecfeff; stroke: #0891b2; }
      .llm { fill: #f5f3ff; stroke: #7c3aed; }
      .db { fill: #f0f9ff; stroke: #0e7490; }
      .model { fill: #faf5ff; stroke: #8b5cf6; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .lineResp { stroke: #0f766e; stroke-width: 2.6; fill: none; marker-end: url(#arrowResp); }
      .hint { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#334155"/>
    </marker>
    <marker id="arrowResp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="34" y="40" class="title">Avivo HR RAG — Current Working Flow (Strict Sequential Chain)</text>

  <!-- Main chain nodes -->
  <rect x="20" y="190" width="150" height="90" class="node user"/>
  <text x="95" y="224" text-anchor="middle" class="label">Telegram User</text>
  <text x="95" y="244" text-anchor="middle" class="small">asks question</text>

  <rect x="210" y="190" width="170" height="90" class="node bot"/>
  <text x="295" y="222" text-anchor="middle" class="label">telegram-bot</text>
  <text x="295" y="244" text-anchor="middle" class="small">chat adapter</text>

  <rect x="420" y="190" width="170" height="90" class="node api"/>
  <text x="505" y="222" text-anchor="middle" class="label">rag-api</text>
  <text x="505" y="244" text-anchor="middle" class="small">entrypoint</text>

  <rect x="630" y="70" width="180" height="90" class="node vector"/>
  <text x="720" y="102" text-anchor="middle" class="label">vector-db</text>
  <text x="720" y="124" text-anchor="middle" class="small">retrieve context</text>

  <rect x="850" y="190" width="170" height="90" class="node api"/>
  <text x="935" y="222" text-anchor="middle" class="label">rag-api</text>
  <text x="935" y="244" text-anchor="middle" class="small">build prompt</text>

  <rect x="1060" y="310" width="190" height="90" class="node llm"/>
  <text x="1155" y="342" text-anchor="middle" class="label">llm-service</text>
  <text x="1155" y="364" text-anchor="middle" class="small">generate answer</text>

  <rect x="1290" y="190" width="170" height="90" class="node api"/>
  <text x="1375" y="222" text-anchor="middle" class="label">rag-api</text>
  <text x="1375" y="244" text-anchor="middle" class="small">final payload</text>

  <!-- Side dependency nodes -->
  <rect x="840" y="70" width="180" height="90" class="node db"/>
  <text x="930" y="102" text-anchor="middle" class="label">ChromaDB</text>
  <text x="930" y="124" text-anchor="middle" class="small">vector index</text>

  <rect x="1290" y="310" width="170" height="90" class="node model"/>
  <text x="1375" y="342" text-anchor="middle" class="label">Phi-3 GGUF</text>
  <text x="1375" y="364" text-anchor="middle" class="small">local model</text>

  <!-- Numbered sequential chain -->
  <path d="M 170 235 L 210 235" class="line"/>
  <text x="186" y="225" class="step">1</text>

  <path d="M 380 235 L 420 235" class="line"/>
  <text x="396" y="225" class="step">2</text>

  <path d="M 590 220 L 630 120" class="line"/>
  <text x="604" y="162" class="step">3</text>

  <path d="M 810 115 L 850 115" class="line"/>
  <text x="826" y="105" class="step">4</text>

  <path d="M 630 140 L 590 235" class="lineResp"/>
  <text x="603" y="201" class="step">5</text>

  <path d="M 1020 250 L 1060 335" class="line"/>
  <text x="1038" y="295" class="step">6</text>

  <path d="M 1250 345 L 1290 345" class="line"/>
  <text x="1266" y="335" class="step">7</text>

  <path d="M 1060 350 L 1020 250" class="lineResp"/>
  <text x="1031" y="320" class="step">8</text>

  <path d="M 1020 235 L 1290 235" class="lineResp"/>
  <text x="1150" y="225" class="step">9</text>

  <path d="M 1290 250 C 900 460, 260 460, 210 250" class="lineResp"/>
  <text x="740" y="468" class="step">10</text>

  <path d="M 210 250 C 170 320, 120 320, 95 280" class="lineResp"/>

  <!-- Captions -->
  <text x="20" y="72" class="hint">Retrieval happens first (steps 3-5), then generation (steps 6-8).</text>
  <text x="20" y="92" class="hint">No parallel rag-api fan-out: this diagram is intentionally drawn as a sequential chain.</text>
</svg>
