<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">Avivo RAG Current Sequential Flow</title>
  <desc id="desc">User to Telegram NavRag bot to telegram-bot service to rag-api service to vector-db service using ChromaDB, back to rag-api, then llm-service, then back to user via telegram-bot.</desc>

  <defs>
    <style>
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .step { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .note { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }

      .node { stroke-width: 2; rx: 12; }
      .user { fill: #fff7ed; stroke: #ea580c; }
      .bot { fill: #f0fdf4; stroke: #16a34a; }
      .api { fill: #eff6ff; stroke: #2563eb; }
      .vector { fill: #ecfeff; stroke: #0891b2; }
      .llm { fill: #f5f3ff; stroke: #7c3aed; }
      .dep { fill: #f8fafc; stroke: #64748b; }

      .req { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrowReq); }
      .res { stroke: #0f766e; stroke-width: 2.7; fill: none; marker-end: url(#arrowRes); }
      .internal { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrowDep); }
    </style>

    <marker id="arrowReq" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#334155"/>
    </marker>
    <marker id="arrowRes" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#0f766e"/>
    </marker>
    <marker id="arrowDep" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="26" y="38" class="title">Avivo HR RAG — Verified Current Runtime Flow (Sequential)</text>

  <!-- Main sequential chain -->
  <rect x="20" y="190" width="150" height="95" class="node user"/>
  <text x="95" y="224" text-anchor="middle" class="label">User</text>
  <text x="95" y="246" text-anchor="middle" class="small">asks HR question</text>

  <rect x="210" y="190" width="170" height="95" class="node bot"/>
  <text x="295" y="221" text-anchor="middle" class="label">Telegram NavRag</text>
  <text x="295" y="243" text-anchor="middle" class="small">bot in Telegram</text>

  <rect x="420" y="190" width="190" height="95" class="node bot"/>
  <text x="515" y="221" text-anchor="middle" class="label">telegram-bot service</text>
  <text x="515" y="243" text-anchor="middle" class="small">Python bot runtime</text>

  <rect x="650" y="190" width="170" height="95" class="node api"/>
  <text x="735" y="221" text-anchor="middle" class="label">rag-api service</text>
  <text x="735" y="243" text-anchor="middle" class="small">/ask, /ask-rag</text>

  <rect x="860" y="190" width="180" height="95" class="node vector"/>
  <text x="950" y="221" text-anchor="middle" class="label">vector-db service</text>
  <text x="950" y="243" text-anchor="middle" class="small">/query retrieval</text>

  <rect x="1080" y="190" width="170" height="95" class="node api"/>
  <text x="1165" y="221" text-anchor="middle" class="label">rag-api service</text>
  <text x="1165" y="243" text-anchor="middle" class="small">builds prompt</text>

  <rect x="1290" y="190" width="170" height="95" class="node llm"/>
  <text x="1375" y="221" text-anchor="middle" class="label">llm-service</text>
  <text x="1375" y="243" text-anchor="middle" class="small">/ask generation</text>

  <rect x="1500" y="190" width="190" height="95" class="node bot"/>
  <text x="1595" y="221" text-anchor="middle" class="label">telegram-bot service</text>
  <text x="1595" y="243" text-anchor="middle" class="small">sends final reply</text>

  <!-- Internal dependencies only -->
  <rect x="860" y="70" width="180" height="80" class="node dep"/>
  <text x="950" y="100" text-anchor="middle" class="label">ChromaDB</text>
  <text x="950" y="120" text-anchor="middle" class="small">internal store of vector-db</text>

  <rect x="1290" y="70" width="170" height="80" class="node dep"/>
  <text x="1375" y="100" text-anchor="middle" class="label">Phi-3 GGUF</text>
  <text x="1375" y="120" text-anchor="middle" class="small">internal model of llm-service</text>

  <!-- Numbered sequential flow -->
  <path d="M 170 238 L 210 238" class="req"/>
  <text x="186" y="227" class="step">1</text>

  <path d="M 380 238 L 420 238" class="req"/>
  <text x="396" y="227" class="step">2</text>

  <path d="M 610 238 L 650 238" class="req"/>
  <text x="626" y="227" class="step">3</text>

  <path d="M 820 238 L 860 238" class="req"/>
  <text x="836" y="227" class="step">4</text>

  <path d="M 1040 256 L 1080 256" class="res"/>
  <text x="1056" y="271" class="step">5</text>

  <path d="M 1250 238 L 1290 238" class="req"/>
  <text x="1266" y="227" class="step">6</text>

  <path d="M 1460 256 L 1500 256" class="res"/>
  <text x="1476" y="271" class="step">7</text>

  <path d="M 1500 238 L 1690 238" class="res"/>
  <text x="1588" y="227" class="step">8</text>

  <!-- Internal dependency arrows (not part of numbered API sequence) -->
  <path d="M 950 150 L 950 190" class="internal"/>
  <path d="M 1375 150 L 1375 190" class="internal"/>

  <text x="20" y="342" class="note">Exact code path: /ask or /ask-rag → answer_with_rag() → fetch_matches() [vector-db] → build prompt → ask_llm() [llm-service].</text>
  <text x="20" y="364" class="note">This is sequential. ChromaDB is an internal backend used by vector-db, not a separate external API step from rag-api.</text>
  <text x="20" y="386" class="small">Numbered steps show request/response chain including Telegram communication exactly as currently implemented.</text>
</svg>
